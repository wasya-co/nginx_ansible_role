server {
  listen 443 ssl;
  server_name {{ origin }} ;
  proxy_read_timeout 3600;

  if ($http_user_agent ~* Googlebot) {
    return 403;
  }

  location ~ ^/$ {
    return 302 /issues/2025q2-issue$is_args$args;
  }
  location ~ ^/es$ {
    return 302 /es/node/2189$is_args$args;
  }
  location ~ ^/ru$ {
    return 302 /ru/node/2189$is_args$args;
  }
  location ~ ^/pt-br$ {
    return 302 /pt-br/node/2189$is_args$args;
  }

  location / {
    proxy_pass http://127.0.0.1:{{ app_port }}/;
  }

  proxy_set_header X-Forwarded-For   $remote_addr;
  proxy_set_header X-Real-IP         $remote_addr;
  proxy_set_header Host              $http_host;
  proxy_set_header X-Forwarded-Proto  https;

  ssl_certificate /opt/tmp/fullchain.pem;
  ssl_certificate_key /opt/tmp/privkey.pem;

}